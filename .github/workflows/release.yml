name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl

          - os: macos-latest
            target: aarch64-apple-darwin

          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set artifact name
        shell: bash
        run: |
          version="$(git describe --tags --match='v*.*.*' --always)"
          name="portman-$version-${{ matrix.target }}"
          echo "ARTIFACT_NAME=$name" >> $GITHUB_ENV

          echo "version: $version"
          echo "artifact: $name"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install cross
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cross

      - name: Build binary [Cross]
        if: matrix.os == 'ubuntu-latest'
        run: cross build --release --locked --target ${{ matrix.target }} --color=always --verbose

      - name: Build binary [Cargo]
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release --locked --target ${{ matrix.target }} --color=always --verbose

      - name: Package [*nix]
        if: runner.os != 'Windows'
        run: >
          tar -cv
          LICENSE README.md default_config.toml
          man/
          -C contrib/ completions/ -C ../
          -C target/${{ matrix.target }}/release/ portman
          | gzip --best > '${{ env.ARTIFACT_NAME }}.tar.gz'

      - name: Package [Windows]
        if: runner.os == 'Windows'
        run: >
          7z a ${{ env.ARTIFACT_NAME }}.zip
          LICENSE README.md default_config.toml
          ./man/
          ./contrib/completions/
          ./target/${{ matrix.target }}/release/portman.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            *.zip
            *.tar.gz

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.zip
            *.tar.gz

  packslip:
    name: Sign packslip
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Sign release
        id: packslip
        uses: jdx/packslip@v1
        with:
          download: portman-*.tar.gz portman-*.zip
          bin: portman
          upload: false
          resources: |
            completion/bash=archive:completions/portman.bash
            completion/zsh=archive:completions/_portman
            completion/fish=archive:completions/portman.fish
            completion/powershell=archive:completions/_portman.ps1
            completion/elvish=archive:completions/portman.elv
            man=archive:man/man1/portman-caddyfile.1
            man=archive:man/man1/portman-cleanup.1
            man=archive:man/man1/portman-config-edit.1
            man=archive:man/man1/portman-config-show.1
            man=archive:man/man1/portman-config.1
            man=archive:man/man1/portman-create.1
            man=archive:man/man1/portman-delete.1
            man=archive:man/man1/portman-env.1
            man=archive:man/man1/portman-get.1
            man=archive:man/man1/portman-init.1
            man=archive:man/man1/portman-link.1
            man=archive:man/man1/portman-list.1
            man=archive:man/man1/portman-reload-caddy.1
            man=archive:man/man1/portman-repo-delete.1
            man=archive:man/man1/portman-repo-list.1
            man=archive:man/man1/portman-repo.1
            man=archive:man/man1/portman-unlink.1
            man=archive:man/man1/portman.1

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: packslip-bundle
          path: ${{ steps.packslip.outputs.bundle }}
          if-no-files-found: error

  publish-packslip:
    name: Publish packslip
    needs: packslip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: packslip-bundle
          path: packslip

      - name: Upload bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "$GITHUB_REF_NAME" packslip/packslip.sigstore.json
          --repo "$GITHUB_REPOSITORY" --clobber
